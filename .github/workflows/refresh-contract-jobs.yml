name: Refresh Canadian Contract Jobs
on:
  workflow_dispatch:
  schedule:
    - cron: '22 12,18 * * *'
permissions:
  contents: write
concurrency:
  group: qun-jobs-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve authorized job feed
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python scripts/refresh_jobs.py
      - name: Commit refreshed listings
        run: |
          if git diff --quiet -- opportunities/data/jobs.json; then
            echo 'No listing changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add opportunities/data/jobs.json
          git commit -m 'Refresh Canadian contract listings'
          git push
